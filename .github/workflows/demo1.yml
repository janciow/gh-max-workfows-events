name: Events Demo 1
on: 
  push:
    - main
    - dev
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Checkout
        uses: actions/checkout@v4
      - name: Step 3
        run: |
          pwd >> myArti.txt
          mkdir artifold 
          echo `ls -ltr` >>  artifold/hostname.txt
          echo  `hostname` >> artifold/hostname.txt
      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: single_file
          path: ./myArti.txt
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: cheking curent directory
        run: |
          pwd
          ls -ltr
      - name: download
        uses: actions/download-artifact@v5
        with:
          name: single_file
      - name: download dir
        uses: actions/download-artifact@v5
        with:
          name: directory_arti
      - name: cheking curent directory
        run: |
          pwd
          ls -ltr

