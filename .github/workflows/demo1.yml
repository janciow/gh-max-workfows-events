name: Events Demo 1
on: 
  push: 
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Checkout
        uses: actions/checkout@v4
      - name: Step 3
        run: |
          pwd >> myArti.txt
          ls -ltr
          hostname
      - name: Upload
        uses: actions/download-artifact@v4
        with:
          name: single_file
          path: ./myArti.txt
       
